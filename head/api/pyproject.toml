[project]
name = "ccc-head-api"
version = "0.1.0"
description = "CCC head-side APIs — Enroll API (mesh-only, munge key) + Head API (LAN+mesh read board, auth next)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "argon2-cffi>=23.1",  # argon2id password hashing (Head auth store)
    "cryptography>=42",   # AES-256-GCM for the W&B keys head.db holds at rest (atrest.py)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccc_head_api"]
