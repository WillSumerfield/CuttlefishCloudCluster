[project]
name = "ccc-head-api"
version = "0.1.0"
description = "CCC Head API — Arm enrollment now; Slurm/Spawn views (via slurmrestd) next."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccc_head_api"]
