[project]
name = "ccc-head-api"
version = "0.1.0"
description = "CCC head-side APIs — Enroll API (mesh-only, munge key) + Head API (LAN+mesh read board, auth next)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccc_head_api"]
