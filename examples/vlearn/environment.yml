# The Spawn's declared **Environment** (ccc_head_api.environments), built on the Head before placement.
#
# Conda, not uv, and not optional: vlearn ships cp310/cp311 wheels only, and base.sif is Python 3.12.
# `uv venv --system-site-packages` inherits the image interpreter, so it can never install vlearn.
# micromamba brings its own Python, which is the whole reason this file is the shape it is.
name: vlearn
channels:
  - conda-forge
dependencies:
  - python=3.11        # the only versions vlearn ships a Linux wheel for, with 3.10
  - pip

  # libgym.so links all of these dynamically. They resolve at LOAD time, so they are required even
  # headless (`with_render=False`) — a missing one is an OSError on `import vlearn`, not a render error.
  # They come from conda-forge rather than apt because base.sif is a pinned, cluster-wide image with no
  # per-Arm package hook: putting one Feature's dependencies in it would change the image for every Arm.
  - sdl2
  - assimp=5           # conda-forge defaults to 6 (libassimp.so.6); libgym.so wants libassimp.so.5
  - zeromq
  - czmq
  - libglu
  - mesalib

  - pip:
      # cu130 to match base.sif's CUDA and vlearn's own build. Also what supplies libcudart.so.13,
      # which libvsimdynamics.so needs and a bare conda env has no other source for.
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch
      - rl_games==1.6.5
      - gym==0.26.2
      - gymnasium
      - hydra-core
      - tensorboard
      - h5py
      - matplotlib
      - pyyaml
      # Placed here by prepare.sh — vlearn is not on any index.
      - ./vlearn-0.3.9-cp311-cp311-linux_x86_64.whl
