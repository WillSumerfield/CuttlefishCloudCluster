# Starter Environment for the 'vlearn' Arm Feature — `cuttle feature show vlearn`.
# Vsim/vlearn — GPU physics + RL, licensed per machine (TurboActivate).
#
# assets/, shaders/, cache/ and TurboActivate.dat come from the Arm — do not upload your own.
#
# Do not add vlearn itself here. The Arm supplies the build its own licence covers, and CCC puts
# it on this Spawn's PYTHONPATH.
name: vlearn
channels:
  - conda-forge
dependencies:
  # the only versions vlearn ships a Linux wheel for, with 3.10 — and base.sif is 3.12, which is
  # why this file has to be conda (its own interpreter) and not uv (which inherits the image's)
  - python=3.11
  - pip

  # What vlearn's shared objects link against. They resolve at LOAD time, so a
  # missing one is an ImportError rather than a missing-feature error at run time.
  - sdl2
  - assimp=5   # conda-forge defaults to 6 (libassimp.so.6); libgym.so wants libassimp.so.5
  - zeromq
  - czmq
  - libglu
  - mesalib

  - pip:
      # cu130, to match base.sif's CUDA and vlearn's own build
      - --extra-index-url https://download.pytorch.org/whl/cu130
      # libcudart.so.13, which libvsimdynamics.so needs and a bare conda env has no other source
      # for
      - nvidia-cuda-runtime>=13,<14

      # Everything from here down is this example's own — what train/rl_games_train.py imports, added
      # to the generated starter exactly the way any project adds its dependencies. torch happens to
      # bring libcudart too; nvidia-cuda-runtime stays named above because it is what the FEATURE
      # needs, and a project driving vlearn without torch should not have to discover that.
      - torch
      - rl_games==1.6.5
      - gym==0.26.2
      - gymnasium
      - hydra-core
      - tensorboard
      - h5py
      - matplotlib
      - pyyaml
